<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Página de informações sobre o cantor The Weeknd, incluindo biografia, discografia e notícias recentes.">

    <title>The Weeknd</title>

    <link rel="icon" type="image/x-icon" href="imagens/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="https://kit.fontawesome.com/cb07f88897.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <h1><img src="imagens/the-weeknd-logo.png" alt="Logotipo The Weeknd" width="600"></h1>

        <nav>
            <ul>
                <li><i class="fa-solid fa-house fa-2xl" style="color: rgb(180, 0, 1);"></i><a href="index.html">Home</a>
                </li>
                <li><i class="fa-solid fa-cross fa-2xl" style="color: rgb(180, 0, 1);"></i><a
                        href="sobre.html">Sobre</a></li>
                <li><i class="fa-solid fa-envelope fa-2xl" style="color: rgb(180, 0, 1);"></i><a
                        href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="secao-contato">
            <h2>Assine nossa Newsletter</h2>
            <p>Receba novidades sobre <strong>The Weeknd</strong> e sua carreira: novos lançamentos, shows, discos e
                <em>curiosidades</em> direto no seu e-mail.</p>

            <form action="#" method="post" class="form-newsletter">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" autocomplete="name" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email"
                        required>
                </div>

                <div class="campo">
                    <label for="assunto">Assunto</label>
                    <input type="text" id="assunto" name="assunto" placeholder="Ex.: novidades do próximo álbum"
                        required>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" name="categoria" required>
                        <option value="" disabled selected>Escolha uma categoria</option>
                        <option value="lancamentos">Novos lançamentos</option>
                        <option value="shows">Shows e turnês</option>
                        <option value="discografia">Discografia e coletâneas</option>
                        <option value="curiosidades">Curiosidades e bastidores</option>
                        <option value="tudo">Tudo sobre o The Weeknd</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="comentario">Comentário</label>
                    <textarea id="comentario" name="comentario" rows="5"
                        placeholder="Conte o que você mais gostaria de receber"></textarea>
                </div>

                <button type="submit">Quero receber as novidades</button>
            </form>
        </section>
    </main>

</body>

</html>
